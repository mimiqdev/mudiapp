---
name: Mudi

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: dev.mudi
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    WATCHOS_DEPLOYMENT_TARGET: "11.0"
    TVOS_DEPLOYMENT_TARGET: "17.0"

packages:
  HerdrKit:
    path: Packages/HerdrKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  SwiftMosh:
    url: https://github.com/wiedymi/swift-mosh.git
    exactVersion: 0.1.8

targets:
  Mudi:
    type: application
    platform: iOS
    sources:
      - path: Mudi
        excludes:
          - "**/README.md"
    resources:
      - path: Mudi/Resources/SymbolsNerdFontMono-Regular.ttf
      - path: Mudi/Resources/SymbolsNerdFontMono-LICENSE.txt
    dependencies:
      - package: HerdrKit
      - package: SwiftTerm
      - package: Citadel
      - package: SwiftMosh
        products:
          - MoshCore
          - MoshBootstrap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mudi.mobile
        PRODUCT_NAME: Mudi
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mudi
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Mudi connects to SSH servers on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: "NO"
    scheme:
      testTargets:
        - MudiTests
      gatherCoverageData: true

  MudiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MudiTests
    dependencies:
      - target: Mudi
      - package: HerdrKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mudi.app/Mudi"
